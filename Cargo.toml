[package]
name = "brok-obsidian"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Brokspace shard that mirrors a remote Obsidian vault into a local, read-only copy you can search"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brokspace/brok-obsidian"
readme = "README.md"
keywords = ["brokspace", "shard", "obsidian"]
categories = ["development-tools"]

[dependencies]
anyhow = "1.0"
brok-sdk = "0.3"
futures-util = { version = "0.3", default-features = false }
globset = "0.4"
percent-encoding = "2.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
rcgen = "0.14"
tempfile = "3.20"
tokio = { version = "1.47", features = ["net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
